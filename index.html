async function submitBookingForm(evt, editingId){
  evt.preventDefault();
  try{
  const data = {
    date: document.getElementById('f_date').value,
    time: document.getElementById('f_time').value,
    timeEnd: document.getElementById('f_timeEnd').value,
    allDay: document.getElementById('f_allDay').checked,
    handledBy: document.getElementById('f_handledBy').value,
    package: document.getElementById('f_package').value,
    clientName: document.getElementById('f_clientName').value.trim(),
    hairdo: document.getElementById('f_hairdo').value.trim(),
    hairdoPrice: (() => {
      const raw = document.getElementById('f_hairdoPrice').value.replace(/[^0-9]/g, '');
      return raw ? Number(raw) : null;
    })(),
    phone: '08' + document.getElementById('f_phone_rest').value.trim(),
    venue: document.getElementById('f_venue').value.trim(),
    look: document.getElementById('f_look').value,
    retouch: document.getElementById('f_retouch').value,
    igAccount: document.getElementById('f_igAccount').value.trim(),
    age: document.getElementById('f_age').value.trim(),
    totalPax: document.getElementById('f_totalPax').value ? Number(document.getElementById('f_totalPax').value) : null,
    price: Number(document.getElementById('f_price').value.replace(/[^0-9]/g, '')) || 0,
    homeServiceFee: (() => {
      const raw = document.getElementById('f_homeServiceFee').value.replace(/[^0-9]/g, '');
      return raw ? Number(raw) : null;
    })(),
    transportFee: (() => {
      const raw = document.getElementById('f_transportFee').value.replace(/[^0-9]/g, '');
      return raw ? Number(raw) : null;
    })(),
    othersFee: (() => {
      const raw = document.getElementById('f_othersFee').value.replace(/[^0-9]/g, '');
      return raw ? Number(raw) : null;
    })(),
    discountType: document.getElementById('f_discountType')?.value || 'none',
    discountValue: (() => {
      const type = document.getElementById('f_discountType')?.value || 'none';
      if(type === 'none') return 0;
      const raw = (document.getElementById('f_discountValue')?.value || '').replace(/[^0-9.]/g,'');
      return raw ? Number(raw) : 0;
    })(),
    teamAllocation: (() => {
      const el = document.getElementById('f_teamAllocation');
      const raw = el ? el.value.replace(/[^0-9]/g, '') : '';
      // Only save if the field is visible (condition met)
      const pkg = document.getElementById('f_package')?.value || '';
      const handled = document.getElementById('f_handledBy')?.value || '';
      const visible = pkg === 'Diamond Wedding' || handled === 'Team';
      return (visible && raw) ? Number(raw) : 0;
    })(),
    depositAmount: (() => {
      const raw = document.getElementById('f_depositAmount').value.replace(/[^0-9]/g, '');
      return raw ? Number(raw) : null;
    })(),
    depositStage: document.getElementById('f_depositStage').value,
    note: document.getElementById('f_note').value.trim(),
    internalNotes: document.getElementById('f_internalNotes').value.trim(),
  };

  const finalizeSave = async () => {
    try{
      if(editingId){
        const idx = bookings.findIndex(b => b.id === editingId);
        if(idx > -1) bookings[idx] = { ...bookings[idx], ...data };
      } else {
        bookings.push({ id: uid(), invoiceNumber: null, ...data });
      }
      await persistBookings();
      const openedDate = data.date;
      closeModal();
      refreshAll();
      if(currentView === 'home') openDayModal(openedDate, true);
    }catch(err){
      console.error(err);
      showToast('Booking could not be saved. Please try again.');
    }
  };

  const finishConflictCheck = async () => {
    const conflict = data.time ? findScheduleConflict(data.date, data.time, data.timeEnd, editingId) : null;
    if(conflict){
      const conflictRange = conflict.timeEnd ? `${conflict.time} - ${conflict.timeEnd}` : conflict.time;
      customConfirm(`This schedule overlaps with ${conflict.clientName}'s booking (${conflictRange}) on the same date. Are you sure you want to save it anyway?`, finalizeSave);
    } else {
      await finalizeSave();
    }
  };

  if(isDateBlockedAllDay(data.date, editingId)){
    showToast('This date is fully booked (All Day) and cannot accept more bookings.');
    return false;
  }

  /* ---- Payment amount validation ---- */
  const pax = Number(data.totalPax) >= 1 ? Number(data.totalPax) : 1;
  const formTotalDue = ((data.price || 0) * pax) + (data.homeServiceFee || 0) + (data.transportFee || 0) + (data.othersFee || 0);
  const depositVal = data.depositAmount || 0;
  if(depositVal < 0){
    showToast('Payment amount cannot be negative.');
    return false;
  }
  if(formTotalDue > 0 && depositVal > formTotalDue){
    const depositEl = document.getElementById('f_depositAmount');
    if(depositEl) showFieldError(depositEl, `Payment exceeds the total booking amount. Maximum: ${formatRupiah(formTotalDue)}.`);
    showToast(`Payment exceeds the total booking amount. Maximum: ${formatRupiah(formTotalDue)}.`);
    return false;
  }
  /* ---- End payment validation ---- */

  if(data.allDay){
    const otherBookings = bookings.filter(b => b.id !== editingId && b.date === data.date && !b.cancelled);
    if(otherBookings.length > 0){
      customConfirm(`This date already has ${otherBookings.length} other booking${otherBookings.length > 1 ? 's' : ''}. Setting it to All Day will conflict with ${otherBookings.length > 1 ? 'them' : otherBookings[0].clientName}. Are you sure you want to continue?`, () => finishConflictCheck());
      return false;
    }
  }

  await finishConflictCheck();
  }catch(err){
    console.error(err);
    showToast('Booking could not be saved. Please check the required fields and try again.');
  }
  return false;
}

function cancelBooking(id){
  const b = bookings.find(x => x.id === id);
  if(!b) return;
  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal w-sm">
        <div class="modal-head">
          <div>
            <h2>Cancel Booking</h2>
            <div class="sub">${escapeHtml(b.clientName)}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="field">
            <label>Cancellation Reason</label>
            <textarea id="cancelReasonText" placeholder="Write the cancellation reason..."></textarea>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" style="flex:1" onclick="closeModal()">Cancel</button>
            <button type="button" id="confirmCancelBtn" class="btn btn-danger-solid" style="flex:1">Yes, Cancel</button>
          </div>
        </div>
      </div>
    </div>
  `);
  const confirmBtn = document.getElementById('confirmCancelBtn');
  if(confirmBtn) confirmBtn.addEventListener('click', () => confirmCancelBooking(id));
}

async function confirmCancelBooking(id){
  const b = bookings.find(x => x.id === id);
  if(!b) return;
  const reasonEl = document.getElementById('cancelReasonText');
  const reason = reasonEl ? reasonEl.value.trim() : '';
  const date = b.date;
  b.cancelled = true;
  b.cancelReason = reason;
  await persistBookings();
  closeModal();
  refreshAll();
  if(currentView === 'home') openDayModal(date);
}

async function markDone(id){
  const b = bookings.find(x => x.id === id);
  if(!b) return;
  if(b.depositStage !== 'Full Payment'){
    showToast('This booking cannot be marked Done until it is Full Payment.');
    return;
  }
  const date = b.date;
  b.done = true;
  await persistBookings();
  refreshAll();
  if(currentView === 'home') openDayModal(date);
}

/* ================= INVOICE ================= */
function ensureInvoiceNumber(b){
  if(!b.invoiceNumber){
    const d = new Date();
    const ymd = d.getFullYear().toString() + pad(d.getMonth()+1) + pad(d.getDate());
    b.invoiceNumber = `INV-${ymd}-${b.id.slice(-4).toUpperCase()}`;
    persistBookings();
  }
  return b.invoiceNumber;
}

function openInvoice(bookingId, forcePelunasan){
  const b = bookings.find(x => x.id === bookingId);
  if(!b) return;
  const invNumber = ensureInvoiceNumber(b);
  const pkg = PACKAGES[b.package] || PACKAGES.Others;

  const homeService = b.homeServiceFee || 0;
  const transport = b.transportFee || 0;
  const others = b.othersFee || 0;
  const discountAmt = bookingDiscount(b);
  const discountLbl = b.discountType === 'percent' ? `Discount (${b.discountValue}%)` : 'Discount';
  const totalDue = bookingTotalDue(b);

  let paidRow = '';
  let remaining = totalDue;
  let statusLabel = 'No payment yet';
  const isLunas = b.depositStage === 'Full Payment';
  const invoiceTitle = forcePelunasan ? 'Final Payment Invoice' : (isLunas ? 'Paid in Full Invoice' : 'Invoice');

  if(isLunas){
    remaining = 0;
    statusLabel = 'Paid in Full';
    paidRow = `<tr><td>Payment Status</td><td class="r">Paid in Full</td></tr>`;
  } else if(b.depositStage && b.depositAmount){
    remaining = Math.max(totalDue - b.depositAmount, 0);
    statusLabel = `${b.depositStage} received`;
    paidRow = `
      <tr><td>Booking Deposit (${b.depositStage})</td><td class="r">-${formatRupiah(b.depositAmount)}</td></tr>
    `;
  }

  const extraRows = `
    ${discountAmt > 0 ? `<tr><td style="color:#2E7D52;font-weight:600;">${escapeHtml(discountLbl)}</td><td class="r" style="color:#2E7D52;">−${formatRupiah(discountAmt)}</td></tr>` : ''}
    ${homeService > 0 ? `<tr><td>Additional Home Service</td><td class="r">${formatRupiah(homeService)}</td></tr>` : ''}
    ${transport > 0 ? `<tr><td>Additional Transport</td><td class="r">${formatRupiah(transport)}</td></tr>` : ''}
    ${others > 0 ? `<tr><td>Others</td><td class="r">${formatRupiah(others)}</td></tr>` : ''}
  `;

  showModal(`
    <div class="overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal w-lg">
        <div class="modal-head">
          <div>
            <h2>${invoiceTitle}</h2>
            <div class="sub">${invNumber}</div>
          </div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
          <div class="inv-sheet" id="invSheet">
            <div class="inv-top">
              <div class="inv-brand-wrap">
                <div class="inv-brand-logo"><img src="${LOGO_SRC}" alt="ND MUA"></div>
                <div class="inv-brand-text">
                  <div class="inv-brand">Nataliadesiandra MUA</div>
                  <div class="inv-brand-sub">Makeup Artist &amp; Beauty Services</div>
                </div>
              </div>
              <div class="inv-meta">
                <div>No. Invoice: <b>${invNumber}</b></div>
                <div>Invoice Date: <b>${formatDateLong(toDateStr(today.getFullYear(), today.getMonth(), today.getDate()))}</b></div>
              </div>
            </div>
            <div class="inv-hr"></div>
            <div class="inv-block-label">Billed To</div>
            <div style="font-size:14px;line-height:1.6;">
              <b>${escapeHtml(b.clientName)}</b><br>
              ${escapeHtml(b.phone) || '-'}<br>
              ${escapeHtml(b.venue) || '-'}<br>
              Event Date: ${formatDateLong(b.date)}${b.time ? ', at ' + escapeHtml(formatTimeRange(b)) : ''}
            </div>

            <table class="inv-table">
              <tr><td>${pkg.label}${(Number(b.totalPax)||1) > 1 ? ` × ${b.totalPax} pax` : ''}</td><td class="r">${formatRupiah(bookingBasePrice(b))}</td></tr>
              ${extraRows}
              ${paidRow}

  await new Promise(r => setTimeout(r, 350));

  const contentH = tpl.scrollHeight;
  const targetH  = Math.max(contentH, 1920);
  tpl.style.minHeight = targetH + 'px';

  const canvas = await html2canvas(tpl, {
    scale: 1,
    useCORS: true,
    backgroundColor: '#FFFAF2',
    width: 1080, height: targetH,
    windowWidth: 1080, windowHeight: targetH,
    scrollX: 0, scrollY: 0, logging: false,
  });
  document.body.removeChild(tpl);

  // Compose final 1080×1920 canvas
  const final = document.createElement('canvas');
  final.width = 1080; final.height = 1920;
  const ctx = final.getContext('2d');
  ctx.fillStyle = '#FFFAF2';
  ctx.fillRect(0, 0, 1080, 1920);

  if(contentH <= 1920){
    ctx.drawImage(canvas, 0, Math.floor((1920 - contentH) / 2));
  } else {
    const ratio = 1920 / canvas.height;
    const scaledW = Math.round(canvas.width * ratio);
    ctx.drawImage(canvas, Math.floor((1080 - scaledW) / 2), 0, scaledW, 1920);
  }

  return { canvas: final, invNumber, clientName: b.clientName || 'client', date: b.date };
}

async function downloadInvoiceImage(bookingId, forcePelunasan){
  const btn = event?.currentTarget;
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan...'; }
  try{
    const { canvas, invNumber, clientName, date } = await buildInvoiceCanvas(bookingId, forcePelunasan);
    const safeName = (clientName).replace(/\s+/g,'_');
    const fileName = `Invoice_${invNumber}_${safeName}_${date}.png`;

    const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
    const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);

    if(isIOS || isSafari){
      const w = window.open('', '_blank');
      if(w){
        const dataUrl = canvas.toDataURL('image/png', 1.0);
        w.document.write(`<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>${fileName}</title>
          <style>*{margin:0;padding:0;box-sizing:border-box;}body{background:#1a1a1a;display:flex;flex-direction:column;align-items:center;min-height:100vh;}
          img{width:100%;max-width:540px;display:block;}.tip{color:#fff;font-family:-apple-system,sans-serif;font-size:14px;text-align:center;padding:16px;opacity:0.8;line-height:1.5;}
          .tip strong{color:#f0c060;}</style></head>
          <body><div class="tip">Tekan lama gambar →<br><strong>Simpan Gambar</strong> atau <strong>Bagikan</strong> ke WhatsApp</div>
          <img src="${dataUrl}" alt="${fileName}"></body></html>`);
        w.document.close();
      } else {
        showImageShareOverlay(canvas.toDataURL('image/png', 1.0), fileName);
      }
    } else {
      const link = document.createElement('a');
      link.download = fileName;
      link.href = canvas.toDataURL('image/png', 1.0);
      link.click();
    }
    showToast('✅ Invoice siap!');
  }catch(e){
    console.error(e);
    showToast('⚠️ Gagal membuat gambar invoice.');
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Download'; }
  }
}

async function shareInvoiceImage(bookingId, forcePelunasan){
  const btn = event?.currentTarget;
  if(btn){ btn.disabled = true; btn.textContent = 'Menyiapkan...'; }
  try{
    const { canvas, invNumber, clientName, date } = await buildInvoiceCanvas(bookingId, forcePelunasan);
    const safeName = (clientName).replace(/\s+/g,'_');
    const fileName = `Invoice_${invNumber}_${safeName}_${date}.png`;

    const blob = await new Promise((res,rej) => canvas.toBlob(b => b ? res(b) : rej(new Error('toBlob failed')), 'image/png', 1.0));
    const file = new File([blob], fileName, { type: 'image/png' });

    if(navigator.share && navigator.canShare && navigator.canShare({ files:[file] })){
      await navigator.share({
        title: `Invoice ${invNumber}`,
        text: `Invoice ${invNumber} untuk ${clientName}.`,
        files: [file],
      });
    } else {
      // Fallback: download
      const url = URL.createObjectURL(file);
      const link = document.createElement('a');
      link.href = url; link.download = fileName; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      showToast('Gambar diunduh. Bagikan dari galeri.');
    }
  }catch(e){
    if(e?.name !== 'AbortError'){
      console.error(e);
      showToast('⚠️ Gagal share invoice.');
    }
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Share'; }
  }
}

/* ─── Ensure user doc exists in Firestore ─── */
async function ensureUserDoc(fbUser){
  const ref = usersColRef().doc(fbUser.uid);
  const snap = await ref.get();
  if(!snap.exists){
    // New user — default role staff (owner set by UID)
    const role = fbUser.uid === OWNER_UID ? 'owner' : 'staff';
    await ref.set({
      email: fbUser.email,
      displayName: fbUser.displayName || fbUser.email.split('@')[0],
      role,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    return { email: fbUser.email, displayName: fbUser.displayName || fbUser.email.split('@')[0], role };
  }
  return snap.data();
}

/* ─── Load user from Firestore ─── */
async function loadUserData(fbUser){
  const data = await ensureUserDoc(fbUser);
  currentUser = {
    uid: fbUser.uid,
    email: fbUser.email,
    role: data.role || 'staff',
    displayName: data.displayName || fbUser.email.split('@')[0]
  };
}

  _authBound = true;
  const goSignup  = document.getElementById('goToSignupBtn');
  const goLogin   = document.getElementById('goToLoginBtn');
  const loginForm = document.getElementById('loginForm');
  if(goSignup)   goSignup.addEventListener('click', showSignupView);

async function attemptLogin(evt){
  evt.preventDefault();
  const email  = document.getElementById('loginUser').value.trim();
  const pass   = document.getElementById('loginPass').value;
  const errEl  = document.getElementById('loginError');
  const btn    = document.getElementById('loginSubmitBtn');
  if(btn){ btn.textContent = 'Signing in...'; btn.disabled = true; }
  try{
    await fsAuth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    await fsAuth().signInWithEmailAndPassword(email, pass);
    errEl.style.display = 'none';
  }catch(e){
    let msg = 'Email atau password salah.';
    if(e.code === 'auth/user-not-found') msg = 'Email tidak terdaftar.';
    else if(e.code === 'auth/wrong-password') msg = 'Password salah.';
    else if(e.code === 'auth/invalid-email') msg = 'Format email tidak valid.';
    else if(e.code === 'auth/too-many-requests') msg = 'Terlalu banyak percobaan. Coba lagi nanti.';
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }finally{
    if(btn){ btn.textContent = 'Login'; btn.disabled = false; }
  }
  return false;
}

              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cpNew',this)"><svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div class="field"><label>Konfirmasi Password Baru</label>
            <div class="password-input-group">
              <input type="password" id="cpConfirm" required>
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility('cpConfirm',this)"><svg class="eye-icon" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <div id="cpError" class="login-error" style="display:none;"></div>
          <div class="form-actions">
            <button type="button" class="btn btn-ghost" style="flex:1" onclick="closeModal()">Batal</button>
            <button type="button" class="btn btn-primary" style="flex:1" onclick="submitChangePassword()">Simpan</button>
          </div>
        </div>
      </div>
    </div>
  `);
}

async function submitChangePassword(){
  const cur   = document.getElementById('cpCurrent').value;
  const nw    = document.getElementById('cpNew').value;
  const conf  = document.getElementById('cpConfirm').value;
  const errEl = document.getElementById('cpError');
  if(!nw || nw.length < 6){ errEl.textContent='Password baru minimal 6 karakter.'; errEl.style.display='block'; return; }
  if(nw !== conf){ errEl.textContent='Password baru tidak cocok.'; errEl.style.display='block'; return; }
  try{
    const fbUser = fsAuth().currentUser;
    // Re-authenticate first
    const cred = firebase.auth.EmailAuthProvider.credential(fbUser.email, cur);
    await fbUser.reauthenticateWithCredential(cred);
    await fbUser.updatePassword(nw);
    closeModal();
    showToast('Password berhasil diubah.');
  }catch(e){
    let msg = 'Gagal mengubah password.';
    if(e.code === 'auth/wrong-password') msg = 'Password saat ini salah.';
    errEl.textContent = msg;
    errEl.style.display = 'block';
  }
}

/* ─── Kelola User (Owner only) ─── */
async function openManageUsersModal(){
  if(!isOwner()){ showToast('Hanya Owner yang bisa kelola user.'); return; }
  const users = await loadUsers();
  const rows = Object.entries(users).map(([uid, u]) => `
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(220,195,165,0.3);">
      <div style="flex:1;min-width:0;">
        <div style="font-size:14px;font-weight:700;color:var(--ink);">${escapeHtml(u.displayName||u.email||uid)}</div>
        <div style="font-size:12px;color:var(--ink-soft);">${escapeHtml(u.email||uid)} · ${escapeHtml(u.role)}</div>
      </div>
      ${uid !== currentUser.uid ? `
      <select onchange="changeUserRole('${uid}',this.value)" style="font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid rgba(200,165,100,0.4);background:var(--cream);font-family:inherit;">
        <option value="owner" ${u.role==='owner'?'selected':''}>Owner</option>
        <option value="staff" ${u.role==='staff'?'selected':''}>Staff</option>
        <option value="viewer" ${u.role==='viewer'?'selected':''}>Viewer</option>
      </select>
      <button onclick="deleteUser('${uid}')" style="background:#FDE6EC;border:1px solid rgba(165,45,70,0.3);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;color:#880E2E;cursor:pointer;font-family:inherit;">Hapus</button>
      ` : `<span style="font-size:12px;color:var(--ink-soft);font-style:italic;">You</span>`}
    </div>`).join('');

  showModal(`
    <div class="preview-overlay" onclick="if(event.target===this) closeModal();">
      <div class="preview-modal" style="max-width:min(100%,480px);">
        <div class="preview-modal-head">
          <div><h2>Kelola User</h2><div class="sub">Tambah, hapus, atau ubah role</div></div>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="preview-modal-body">
          <div id="userListContainer">${rows || '<p style="text-align:center;color:var(--ink-soft);padding:20px;">Belum ada user.</p>'}</div>
          <div style="margin-top:20px;padding-top:16px;border-top:1px solid rgba(220,195,165,0.4);">
            <div style="font-size:13px;font-weight:700;color:var(--ink);margin-bottom:12px;">Tambah User Baru</div>
            <div class="field"><label>Email</label><input type="email" id="newUserEmail" placeholder="contoh: staff@gmail.com"></div>
            <div class="field"><label>Password</label><input type="password" id="newUserPass" placeholder="Min. 6 karakter"></div>
            <div class="field"><label>Nama Tampilan</label><input type="text" id="newUserName" placeholder="Nama staff"></div>
            <div class="field"><label>Role</label>
              <select id="newUserRole" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid rgba(200,165,100,0.4);background:linear-gradient(135deg,var(--ivory),var(--cream));font-family:inherit;font-size:13px;">
                <option value="staff">Staff (bisa tambah & edit booking)</option>
                <option value="viewer">Viewer (hanya lihat)</option>
                <option value="owner">Owner (akses penuh)</option>
              </select>
            </div>
            <div id="newUserError" class="login-error" style="display:none;"></div>
            <button onclick="addNewUser()" class="btn btn-primary btn-block" style="margin-top:8px;">Tambah User</button>
          </div>
        </div>
      </div>
    </div>
  `);
}

async function addNewUser(){
  const email = (document.getElementById('newUserEmail')?.value||'').trim();
  const pass  = document.getElementById('newUserPass')?.value||'';
  const name  = document.getElementById('newUserName')?.value||'';
  const role  = document.getElementById('newUserRole')?.value||'staff';
  const errEl = document.getElementById('newUserError');
  if(!email||!pass){ errEl.textContent='Email dan password wajib diisi.'; errEl.style.display='block'; return; }
  if(pass.length<6){ errEl.textContent='Password minimal 6 karakter.'; errEl.style.display='block'; return; }
  try{
    // Create via Firebase Auth REST (secondary app trick to avoid signing out current user)
    const secApp = firebase.initializeApp(firebase.app().options, 'secondary_'+Date.now());
    const secAuth = secApp.auth();
    const cred = await secAuth.createUserWithEmailAndPassword(email, pass);
    const uid  = cred.user.uid;
    await secApp.delete();
    // Save role to Firestore
    await usersColRef().doc(uid).set({
      email, role,
      displayName: name||email.split('@')[0],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    closeModal();
    showToast(`User ${email} berhasil ditambahkan sebagai ${role}.`);
  }catch(e){
    let msg = 'Gagal membuat user.';
    if(e.code==='auth/email-already-in-use') msg='Email sudah digunakan.';
    else if(e.code==='auth/invalid-email') msg='Format email tidak valid.';
    errEl.textContent = msg; errEl.style.display='block';
  }
}

async function changeUserRole(uid, newRole){
  await usersColRef().doc(uid).update({ role: newRole });
  showToast(`Role diubah ke ${newRole}.`);
}

async function deleteUser(uid){
  customConfirm('Hapus user ini?', async () => {
    await usersColRef().doc(uid).delete();
    closeModal();
    showToast('User dihapus.');
  });
}

/* ─── User menu (header 👤 button) ─── */
function openUserMenu(){
  const overlay = document.createElement('div');
  overlay.className = 'preview-overlay';
  overlay.id = 'userMenuOverlay';
  overlay.style.cssText = 'align-items:flex-end;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 80px);';
  overlay.addEventListener('click', e => { if(e.target===overlay) overlay.remove(); });
  const roleBadge = { owner:'🔑 Owner', staff:'✏️ Staff', viewer:'👁 Viewer' }[currentUser?.role]||'';
  overlay.innerHTML = `
    <div style="background:var(--ivory);border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:20px;">
      <div style="text-align:center;margin-bottom:16px;">
        <div style="font-size:32px;margin-bottom:6px;">👤</div>
        <div style="font-size:16px;font-weight:800;color:var(--ink);">${escapeHtml(currentUser?.displayName||'')}</div>
        <div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${escapeHtml(currentUser?.email||'')} · <span style="color:var(--gold-dark);font-weight:700;">${roleBadge}</span></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${isOwner()?`<button onclick="document.getElementById('userMenuOverlay').remove();openManageUsersModal();" style="padding:13px;background:linear-gradient(135deg,#FBF4E8,#F3E5CC);border:1.5px solid rgba(200,165,100,0.35);border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;">👥 Kelola User</button>`:''}
        <button onclick="document.getElementById('userMenuOverlay').remove();openChangePasswordModal();" style="padding:13px;background:linear-gradient(135deg,#FBF4E8,#F3E5CC);border:1.5px solid rgba(200,165,100,0.35);border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left;">🔒 Ganti Password</button>
        <button onclick="document.getElementById('userMenuOverlay').remove();confirmLogout();" style="padding:13px;background:linear-gradient(135deg,#FDE6EC,#F8CCDA);border:1.5px solid rgba(165,45,70,0.25);border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;color:#880E2E;cursor:pointer;text-align:left;">🚪 Keluar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function togglePasswordVisibility(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const showing = input.type === 'password';
  input.type = showing ? 'text' : 'password';
  if(btn) btn.setAttribute('aria-label', showing ? 'Hide password' : 'Show password');
}

/* ================= INIT ================= */
inlineHandlersWork = detectInlineHandlersWork();
if(!inlineHandlersWork){
  console.warn('Inline event handlers are not executing in this view — falling back to programmatic event bindings.');
  rebindInlineHandlersIfNeeded(document.body);
}
// Firebase Auth handles session — initAuth waits for onAuthStateChanged
// which then calls loadBookings internally
initAuth();
</script>
